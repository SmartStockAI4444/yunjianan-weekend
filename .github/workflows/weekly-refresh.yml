name: Build Weekly Travel Feed

on:
  schedule:
    # 每週一台灣時間上午 9:00 執行
    # GitHub Actions 使用 UTC，所以設定 01:00 UTC
    - cron: "0 1 * * 1"

  # 保留手動測試按鈕
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect travel sources
        run: python collect_sources.py

      - name: Build weekly feed
        run: python build_weekly_feed.py

      - name: Commit updated travel feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add weekly_feed.json sources/official_seed.json sources/social_candidates.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto update weekly travel feed"
            git push
          fi
