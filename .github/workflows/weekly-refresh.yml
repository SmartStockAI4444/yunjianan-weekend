name: Build Weekly Travel Feed

on:
  schedule:
    # 每天更新兩次：台灣時間 08:30、16:30
    # GitHub Actions 使用 UTC，所以是 00:30、08:30 UTC
    - cron: "30 0 * * *"
    - cron: "30 8 * * *"

  # 保留手動測試按鈕
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect travel sources
        run: python collect_sources.py

      - name: Add Chiayi City official activities
        run: python collect_chiayi_city_events.py

      - name: Build weekly feed
        run: python build_weekly_feed.py

      - name: Commit updated travel feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add weekly_feed.json sources/official_seed.json sources/social_candidates.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto update travel feed"
            git push
          fi
