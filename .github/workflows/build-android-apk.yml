name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          CMDLINE_ROOT="$RUNNER_TEMP/android-cmdline-tools"

          echo "Installing private Android SDK into: $SDK_ROOT"

          rm -rf "$SDK_ROOT" "$CMDLINE_ROOT"
          mkdir -p "$SDK_ROOT/cmdline-tools/latest" "$CMDLINE_ROOT"

          curl -fL --retry 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -o "$RUNNER_TEMP/android-commandlinetools.zip"

          unzip -q "$RUNNER_TEMP/android-commandlinetools.zip" -d "$CMDLINE_ROOT"

          cp -R "$CMDLINE_ROOT/cmdline-tools/"* "$SDK_ROOT/cmdline-tools/latest/"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "sdkmanager: $SDKMANAGER"
          test -f "$SDKMANAGER"

          yes | bash "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true

          bash "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        shell: bash
        run: |
          set -e
          rm -rf _android_build
          mkdir -p _android_build/app/src/main/java/com/yunjianan/weekend
          mkdir -p _android_build/app/src/main/res/values
          mkdir -p _android_build/app/src/main/res/drawable
          mkdir -p _android_build/app/src/main/assets

          cp index.html _android_build/app/src/main/assets/index.html
          cp weekly_feed.json _android_build/app/src/main/assets/weekly_feed.json
          [ -f manifest.json ] && cp manifest.json _android_build/app/src/main/assets/manifest.json || true
          [ -f icon-192.png ] && cp icon-192.png _android_build/app/src/main/assets/icon-192.png || true
          [ -f icon-512.png ] && cp icon-512.png _android_build/app/src/main/assets/icon-512.png || true

          if [ -f icon-512.png ]; then
            cp icon-512.png _android_build/app/src/main/res/drawable/app_icon.png
          else
            cp icon-192.png _android_build/app/src/main/res/drawable/app_icon.png
          fi

          python3 - <<'PY'
          from pathlib import Path
          p=Path("_android_build/app/src/main/assets/index.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace("<head>", '<head>\n<script>window.__NATIVE_ANDROID_APP__=true;</script>', 1)
          s=s.replace(
              'function isStandaloneApp(){\n  return window.matchMedia("(display-mode: standalone)").matches ||\n    window.navigator.standalone===true;\n}',
              'function isStandaloneApp(){\n  return window.__NATIVE_ANDROID_APP__===true ||\n    window.matchMedia("(display-mode: standalone)").matches ||\n    window.navigator.standalone===true;\n}',
              1
          )
          s=s.replace(
              '  if("serviceWorker" in navigator){\n    window.addEventListener("load",function(){\n      navigator.serviceWorker.register("./service-worker.js").catch(function(){});\n    });\n  }',
              '  if(!window.__NATIVE_ANDROID_APP__ && "serviceWorker" in navigator){\n    window.addEventListener("load",function(){\n      navigator.serviceWorker.register("./service-worker.js").catch(function(){});\n    });\n  }',
              1
          )
          s=s.replace(
              "<script>\n(function(){",
              '<script>\nif(window.__NATIVE_ANDROID_APP__){\n  window.open=function(url){\n    if(url) window.location.href=url;\n    return null;\n  };\n}\n(function(){',
              1
          )
          native_hook = r"""
          if(window.__NATIVE_ANDROID_APP__){
            window.__nativeLocationTimer=null;

            window.__clearNativeLocationTimer=function(){
              if(window.__nativeLocationTimer){
                clearTimeout(window.__nativeLocationTimer);
                window.__nativeLocationTimer=null;
              }
            };

            window.__receiveNativeLocation=function(lat,lng){
              window.__clearNativeLocationTimer();
              currentUserCoord=[Number(lat),Number(lng)];
              locationState="ready";
              locationSource="gps";
              currentLocationLabel="手機目前位置";
              syncLocationPanel();
              refreshNearbyHint();
              render();
            };

            window.__nativeLocationError=function(msg){
              window.__clearNativeLocationTimer();
              locationState="error";
              currentUserCoord=null;
              locationSource="";
              currentLocationLabel="";
              syncLocationPanel();
              setNearbyHint("⚠️ "+(msg||"目前無法取得手機位置")+"；可改用下方手動位置。","warn");
              render();
            };
          }
          """
          marker="function requestUserLocation(forceGps){"
          if marker in s:
              # IMPORTANT: inject native callbacks inside the same IIFE,
              # before requestUserLocation(), so they close over app state vars.
              s=s.replace(marker, native_hook+"\\n"+marker, 1)
              native_branch=r"""function requestUserLocation(forceGps){
            if(window.__NATIVE_ANDROID_APP__ && window.AndroidLocation){
              if(currentUserCoord&&!forceGps){
                locationState="ready";
                syncLocationPanel();
                refreshNearbyHint();
                render();
                return;
              }
          
              if(!forceGps && applySavedManualLocation()){
                return;
              }
          
              locationState="loading";
              locationSource="gps";
              currentLocationLabel="手機定位";
              syncLocationPanel();
              setNearbyHint("📍 正在由 Android 取得目前位置…","loading");
          
              try{
                window.__clearNativeLocationTimer();
                window.__nativeLocationTimer=setTimeout(function(){
                  window.__nativeLocationError(
                    "Android 定位超過 20 秒沒有回應"
                  );
                },20000);

                window.AndroidLocation.requestLocation();
              }catch(e){
                window.__nativeLocationError("Android 定位服務啟動失敗");
              }
              return;
            }
          """
              s=s.replace(marker,native_branch,1)

          s=s.replace(
              "雲嘉南週末去哪玩 · V5.5",
              "雲嘉南週末去哪玩 · V5.5 · Native6",
              1
          )

          p.write_text(s,encoding="utf-8")
          PY

          cat > _android_build/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "YunJiaNanWeekend"
          include(":app")
          EOF

          cat > _android_build/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > _android_build/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          echo "sdk.dir=$ANDROID_SDK_ROOT" > _android_build/local.properties

          cat > _android_build/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.yunjianan.weekend'
              compileSdk 35

              defaultConfig {
                  applicationId "com.yunjianan.weekend"
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName "5.5-native-6"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
              implementation 'com.google.android.gms:play-services-location:21.3.0'
          }
          EOF

          echo '# no custom rules' > _android_build/app/proguard-rules.pro

          cat > _android_build/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1F6B4F</item>
                  <item name="android:statusBarColor">#1F6B4F</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowBackground">#F5F7F4</item>
              </style>
          </resources>
          EOF

          cat > _android_build/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-feature android:name="android.hardware.location" android:required="false" />
              <uses-feature android:name="android.hardware.location.gps" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/app_icon"
                  android:label="雲嘉南週末"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > _android_build/app/src/main/java/com/yunjianan/weekend/MainActivity.java <<'EOF'
          package com.yunjianan.weekend;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.location.Location;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.ViewGroup;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import androidx.webkit.WebViewAssetLoader;

          import com.google.android.gms.location.FusedLocationProviderClient;
          import com.google.android.gms.location.LocationServices;
          import com.google.android.gms.location.Priority;
          import com.google.android.gms.tasks.CancellationTokenSource;

          public class MainActivity extends Activity {

              private static final int LOCATION_PERMISSION_REQUEST = 4105;
              private static final long LOCATION_TIMEOUT_MS = 15000L;

              private WebView webView;
              private FusedLocationProviderClient fusedLocationClient;
              private final Handler handler = new Handler(Looper.getMainLooper());

              private CancellationTokenSource activeLocationToken;
              private Runnable activeTimeout;
              private boolean locationResolved = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  fusedLocationClient =
                          LocationServices.getFusedLocationProviderClient(this);

                  webView = new WebView(this);
                  webView.setLayoutParams(new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                  ));
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setGeolocationEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.addJavascriptInterface(
                          new NativeLocationBridge(),
                          "AndroidLocation"
                  );

                  WebViewAssetLoader assetLoader =
                          new WebViewAssetLoader.Builder()
                                  .addPathHandler(
                                          "/assets/",
                                          new WebViewAssetLoader.AssetsPathHandler(this)
                                  )
                                  .build();

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(
                              WebView view,
                              WebResourceRequest request
                      ) {
                          return assetLoader.shouldInterceptRequest(
                                  request.getUrl()
                          );
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request
                      ) {
                          Uri uri = request.getUrl();

                          if ("appassets.androidplatform.net"
                                  .equalsIgnoreCase(uri.getHost())) {
                              return false;
                          }

                          try {
                              startActivity(
                                      new Intent(Intent.ACTION_VIEW, uri)
                              );
                          } catch (Exception e) {
                              Toast.makeText(
                                      MainActivity.this,
                                      "無法開啟外部連結",
                                      Toast.LENGTH_SHORT
                              ).show();
                          }
                          return true;
                      }
                  });

                  if (savedInstanceState == null) {
                      webView.loadUrl(
                              "https://appassets.androidplatform.net/assets/index.html"
                      );
                  } else {
                      webView.restoreState(savedInstanceState);
                  }
              }

              public class NativeLocationBridge {
                  @JavascriptInterface
                  public void requestLocation() {
                      runOnUiThread(() -> requestNativeLocation());
                  }
              }

              private boolean hasLocationPermission() {
                  return checkSelfPermission(
                          Manifest.permission.ACCESS_FINE_LOCATION
                  ) == PackageManager.PERMISSION_GRANTED
                          || checkSelfPermission(
                          Manifest.permission.ACCESS_COARSE_LOCATION
                  ) == PackageManager.PERMISSION_GRANTED;
              }

              private void requestNativeLocation() {
                  if (!hasLocationPermission()) {
                      requestPermissions(
                              new String[] {
                                      Manifest.permission.ACCESS_FINE_LOCATION,
                                      Manifest.permission.ACCESS_COARSE_LOCATION
                              },
                              LOCATION_PERMISSION_REQUEST
                      );
                      return;
                  }

                  fetchLocationNow();
              }

              private boolean isLocationEnabled() {
                  try {
                      if (android.os.Build.VERSION.SDK_INT
                              >= android.os.Build.VERSION_CODES.P) {
                          android.location.LocationManager lm =
                                  (android.location.LocationManager)
                                          getSystemService(LOCATION_SERVICE);
                          return lm != null && lm.isLocationEnabled();
                      }
                  } catch (Exception ignored) {
                  }
                  return true;
              }

              private void fetchLocationNow() {
                  if (!hasLocationPermission()) {
                      sendLocationError("尚未取得定位權限");
                      return;
                  }

                  if (!isLocationEnabled()) {
                      sendLocationError("請先開啟手機的「位置」服務");
                      return;
                  }

                  cancelActiveRequest();
                  locationResolved = false;
                  activeLocationToken = new CancellationTokenSource();

                  /* Native5：總逾時從定位一開始就啟動。 */
                  activeTimeout = () -> {
                      if (!locationResolved) {
                          locationResolved = true;

                          if (activeLocationToken != null) {
                              try {
                                  activeLocationToken.cancel();
                              } catch (Exception ignored) {
                              }
                          }

                          sendLocationError(
                                  "Android 定位逾時，請再試一次或使用手動位置"
                          );
                      }
                  };

                  handler.postDelayed(
                          activeTimeout,
                          LOCATION_TIMEOUT_MS
                  );

                  try {
                      /* 最近位置與目前位置同時要求，
                         不再讓 getLastLocation 阻塞流程。 */
                      fusedLocationClient
                              .getLastLocation()
                              .addOnSuccessListener(this, location -> {
                                  if (locationResolved || location == null) {
                                      return;
                                  }

                                  long ageMs =
                                          System.currentTimeMillis()
                                                  - location.getTime();

                                  if (ageMs <= 10 * 60 * 1000L) {
                                      finishLocation(location);
                                  }
                              })
                              .addOnFailureListener(this, e -> {
                                  /* 忽略，current location 仍在進行 */
                              });

                      fusedLocationClient
                              .getCurrentLocation(
                                      Priority.PRIORITY_BALANCED_POWER_ACCURACY,
                                      activeLocationToken.getToken()
                              )
                              .addOnSuccessListener(this, location -> {
                                  if (locationResolved) return;

                                  if (location != null) {
                                      finishLocation(location);
                                  } else {
                                      locationResolved = true;
                                      cancelActiveRequest();
                                      sendLocationError(
                                              "Google 定位服務沒有回傳位置"
                                      );
                                  }
                              })
                              .addOnFailureListener(this, e -> {
                                  if (locationResolved) return;

                                  locationResolved = true;
                                  cancelActiveRequest();

                                  String detail = e == null
                                          ? ""
                                          : e.getClass().getSimpleName();

                                  sendLocationError(
                                          "Google 定位服務失敗"
                                                  + (detail.isEmpty()
                                                  ? ""
                                                  : "：" + detail)
                                  );
                              });

                  } catch (SecurityException e) {
                      locationResolved = true;
                      cancelActiveRequest();
                      sendLocationError("Android 未允許定位權限");
                  } catch (Exception e) {
                      locationResolved = true;
                      cancelActiveRequest();
                      sendLocationError(
                              "無法啟動定位：" + e.getClass().getSimpleName()
                      );
                  }
              }

              private void finishLocation(Location location) {
                  if (locationResolved) return;

                  locationResolved = true;
                  cancelActiveRequest();
                  sendLocation(location);
              }

              private void cancelActiveRequest() {
                  if (activeTimeout != null) {
                      handler.removeCallbacks(activeTimeout);
                      activeTimeout = null;
                  }

                  if (activeLocationToken != null) {
                      try {
                          activeLocationToken.cancel();
                      } catch (Exception ignored) {
                      }
                      activeLocationToken = null;
                  }
              }

              private void sendLocation(Location location) {
                  final double lat = location.getLatitude();
                  final double lng = location.getLongitude();

                  runOnUiThread(() -> webView.evaluateJavascript(
                          "window.__receiveNativeLocation("
                                  + lat + "," + lng + ");",
                          null
                  ));
              }

              private void sendLocationError(String message) {
                  final String safe = org.json.JSONObject.quote(
                          message == null ? "" : message
                  );

                  runOnUiThread(() -> webView.evaluateJavascript(
                          "window.__nativeLocationError("
                                  + safe + ");",
                          null
                  ));
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] grantResults
              ) {
                  super.onRequestPermissionsResult(
                          requestCode,
                          permissions,
                          grantResults
                  );

                  if (requestCode != LOCATION_PERMISSION_REQUEST) {
                      return;
                  }

                  if (hasLocationPermission()) {
                      fetchLocationNow();
                  } else {
                      sendLocationError("定位權限未允許");
                  }
              }

              @Override
              protected void onDestroy() {
                  cancelActiveRequest();

                  if (webView != null) {
                      webView.stopLoading();
                      webView.destroy();
                  }

                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Verify Android environment
        shell: bash
        run: |
          set -e
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -f "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"
          test -f "_android_build/local.properties"
          cat "_android_build/local.properties"

      - name: Build APK
        run: gradle -p _android_build assembleDebug --stacktrace

      - name: Rename APK
        run: cp _android_build/app/build/outputs/apk/debug/app-debug.apk YunJiaNanWeekend-V5.5-native6.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YunJiaNanWeekend-V5.5-Native6-APK
          path: YunJiaNanWeekend-V5.5-native6.apk
          if-no-files-found: error
