          package com.yunjianan.weekend;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Looper;
          import android.view.ViewGroup;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import androidx.webkit.WebViewAssetLoader;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.concurrent.Executors;
          import java.util.concurrent.ScheduledExecutorService;
          import java.util.concurrent.ScheduledFuture;
          import java.util.concurrent.TimeUnit;

          public class MainActivity extends Activity {

              private static final int LOCATION_PERMISSION_REQUEST = 4105;
              private static final long LOCATION_TIMEOUT_SECONDS = 15L;

              private WebView webView;
              private LocationManager locationManager;
              private LocationListener listener;

              private final ScheduledExecutorService scheduler =
                      Executors.newSingleThreadScheduledExecutor();
              private ScheduledFuture<?> timeoutFuture;

              private boolean locationResolved = false;
              private Location fallbackLocation = null;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  locationManager =
                          (LocationManager) getSystemService(Context.LOCATION_SERVICE);

                  webView = new WebView(this);
                  webView.setLayoutParams(new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                  ));
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setGeolocationEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(true);

                  webView.addJavascriptInterface(
                          new NativeLocationBridge(),
                          "AndroidLocation"
                  );

                  WebViewAssetLoader assetLoader =
                          new WebViewAssetLoader.Builder()
                                  .addPathHandler(
                                          "/assets/",
                                          new WebViewAssetLoader.AssetsPathHandler(this)
                                  )
                                  .build();

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(
                              WebView view,
                              WebResourceRequest request
                      ) {
                          return assetLoader.shouldInterceptRequest(
                                  request.getUrl()
                          );
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request
                      ) {
                          Uri uri = request.getUrl();

                          if ("appassets.androidplatform.net"
                                  .equalsIgnoreCase(uri.getHost())) {
                              return false;
                          }

                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, uri));
                          } catch (Exception e) {
                              Toast.makeText(
                                      MainActivity.this,
                                      "無法開啟外部連結",
                                      Toast.LENGTH_SHORT
                              ).show();
                          }
                          return true;
                      }
                  });

                  if (savedInstanceState == null) {
                      webView.loadUrl(
                              "https://appassets.androidplatform.net/assets/index.html"
                      );
                  } else {
                      webView.restoreState(savedInstanceState);
                  }
              }

              public class NativeLocationBridge {
                  @JavascriptInterface
                  public void requestLocation() {
                      runOnUiThread(() -> {
                          directStatus("📍 Native18：Android 已收到定位要求…");
                          Toast.makeText(
                                  MainActivity.this,
                                  "Native18 定位已啟動",
                                  Toast.LENGTH_SHORT
                          ).show();
                          requestNativeLocation();
                      });
                  }
              }

              private boolean hasLocationPermission() {
                  return checkSelfPermission(
                          Manifest.permission.ACCESS_FINE_LOCATION
                  ) == PackageManager.PERMISSION_GRANTED
                          || checkSelfPermission(
                          Manifest.permission.ACCESS_COARSE_LOCATION
                  ) == PackageManager.PERMISSION_GRANTED;
              }

              private void requestNativeLocation() {
                  if (!hasLocationPermission()) {
                      directStatus("📍 Native18：等待位置權限…");
                      requestPermissions(
                              new String[] {
                                      Manifest.permission.ACCESS_FINE_LOCATION,
                                      Manifest.permission.ACCESS_COARSE_LOCATION
                              },
                              LOCATION_PERMISSION_REQUEST
                      );
                      return;
                  }

                  beginLocation();
              }

              private void beginLocation() {
                  if (!hasLocationPermission()) {
                      finalError("尚未取得位置權限");
                      return;
                  }

                  if (locationManager == null) {
                      finalError("Android LocationManager 不可用");
                      return;
                  }

                  stopLocationRequests();
                  locationResolved = false;
                  fallbackLocation = null;

                  List<String> providers = new ArrayList<>();

                  try {
                      if (locationManager.isProviderEnabled(
                              LocationManager.NETWORK_PROVIDER
                      )) {
                          providers.add(LocationManager.NETWORK_PROVIDER);
                      }

                      if (locationManager.isProviderEnabled(
                              LocationManager.GPS_PROVIDER
                      )) {
                          providers.add(LocationManager.GPS_PROVIDER);
                      }
                  } catch (Exception ignored) {
                  }

                  if (providers.isEmpty()) {
                      finalError("請先開啟手機「位置」服務");
                      return;
                  }

                  directStatus(
                          "📍 Native18：權限正常，先讀取 Wi‑Fi／基地台位置…"
                  );

                  try {
                      for (String provider : providers) {
                          Location last =
                                  locationManager.getLastKnownLocation(provider);

                          if (last != null) {
                              if (fallbackLocation == null
                                      || last.getTime()
                                      > fallbackLocation.getTime()) {
                                  fallbackLocation = last;
                              }

                              long ageMs =
                                      System.currentTimeMillis()
                                              - last.getTime();

                              if (ageMs <= 30 * 60 * 1000L) {
                                  finalLocation(
                                          last,
                                          "最近的"
                                                  + providerName(provider)
                                                  + "位置"
                                  );
                                  return;
                              }
                          }
                      }
                  } catch (SecurityException e) {
                      finalError("讀取最近位置時權限被拒絕");
                      return;
                  }

                  directStatus(
                          "📍 Native18：沒有近期位置，正在等 Wi‑Fi／基地台或 GPS…"
                  );

                  listener = new LocationListener() {
                      @Override
                      public void onLocationChanged(Location location) {
                          if (location == null || locationResolved) {
                              return;
                          }

                          finalLocation(
                                  location,
                                  providerName(location.getProvider())
                          );
                      }

                      @Override
                      public void onProviderEnabled(String provider) {
                      }

                      @Override
                      public void onProviderDisabled(String provider) {
                      }

                      @Override
                      public void onStatusChanged(
                              String provider,
                              int status,
                              Bundle extras
                      ) {
                      }
                  };

                  try {
                      if (providers.contains(
                              LocationManager.NETWORK_PROVIDER
                      )) {
                          locationManager.requestLocationUpdates(
                                  LocationManager.NETWORK_PROVIDER,
                                  0L,
                                  0f,
                                  listener,
                                  Looper.getMainLooper()
                          );
                      }

                      if (providers.contains(
                              LocationManager.GPS_PROVIDER
                      )) {
                          locationManager.requestLocationUpdates(
                                  LocationManager.GPS_PROVIDER,
                                  0L,
                                  0f,
                                  listener,
                                  Looper.getMainLooper()
                          );
                      }
                  } catch (SecurityException e) {
                      finalError("要求即時位置時權限被拒絕");
                      return;
                  } catch (Exception e) {
                      finalError(
                              "啟動定位失敗："
                                      + e.getClass().getSimpleName()
                      );
                      return;
                  }

                  timeoutFuture = scheduler.schedule(
                          () -> runOnUiThread(() -> {
                              if (locationResolved) {
                                  return;
                              }

                              if (fallbackLocation != null) {
                                  finalLocation(
                                          fallbackLocation,
                                          "較舊的備援位置"
                                  );
                              } else {
                                  finalError(
                                          "15 秒內 Wi‑Fi／基地台與 GPS 都沒有回傳位置"
                                  );
                              }
                          }),
                          LOCATION_TIMEOUT_SECONDS,
                          TimeUnit.SECONDS
                  );
              }

              private String providerName(String provider) {
                  if (LocationManager.NETWORK_PROVIDER.equals(provider)) {
                      return "網路定位";
                  }
                  if (LocationManager.GPS_PROVIDER.equals(provider)) {
                      return "GPS";
                  }
                  return provider == null ? "Android 定位" : provider;
              }

              private void finalLocation(
                      Location location,
                      String source
              ) {
                  if (locationResolved) {
                      return;
                  }

                  locationResolved = true;
                  stopLocationRequests();

                  double lat = location.getLatitude();
                  double lng = location.getLongitude();

                  directStatus(
                          "✅ Native18：已取得"
                                  + source
                                  + "，正在套用位置…"
                  );

                  Toast.makeText(
                          this,
                          "已取得位置：" + source,
                          Toast.LENGTH_SHORT
                  ).show();

                  String applyScript =
                          "(function(){try{"
                                  + "if(typeof window.__receiveNativeLocation!=='function'){"
                                  + "throw new Error('找不到 __receiveNativeLocation');"
                                  + "}"
                                  + "window.__receiveNativeLocation("
                                  + lat + "," + lng + ");"
                                  + "return 'OK';"
                                  + "}catch(e){"
                                  + "var el=document.getElementById('nearbyHint');"
                                  + "if(el){"
                                  + "el.textContent='⚠️ Native18 套用位置失敗：'+"
                                  + "(e&&e.message?e.message:String(e));"
                                  + "el.className='nearby-hint warn';"
                                  + "}"
                                  + "return 'ERR';"
                                  + "}})();";

                  webView.evaluateJavascript(
                          applyScript,
                          null
                  );
              }

              private void finalError(String message) {
                  if (locationResolved) {
                      return;
                  }

                  locationResolved = true;
                  stopLocationRequests();

                  directStatus("⚠️ Native18：" + message);

                  Toast.makeText(
                          this,
                          message,
                          Toast.LENGTH_LONG
                  ).show();

                  String safe =
                          org.json.JSONObject.quote(message);

                  webView.evaluateJavascript(
                          "window.__nativeLocationError("
                                  + safe + ");",
                          null
                  );
              }

              private void directStatus(String message) {
                  String safe =
                          org.json.JSONObject.quote(message);

                  webView.evaluateJavascript(
                          "(function(){"
                                  + "var e=document.getElementById('nearbyHint');"
                                  + "if(e){"
                                  + "e.textContent=" + safe + ";"
                                  + "e.className='nearby-hint loading';"
                                  + "}"
                                  + "})();",
                          null
                  );
              }

              private void stopLocationRequests() {
                  if (timeoutFuture != null) {
                      timeoutFuture.cancel(true);
                      timeoutFuture = null;
                  }

                  if (locationManager != null && listener != null) {
                      try {
                          locationManager.removeUpdates(listener);
                      } catch (Exception ignored) {
                      }
                  }

                  listener = null;
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] grantResults
              ) {
                  super.onRequestPermissionsResult(
                          requestCode,
                          permissions,
                          grantResults
                  );

                  if (requestCode != LOCATION_PERMISSION_REQUEST) {
                      return;
                  }

                  if (hasLocationPermission()) {
                      directStatus(
                              "📍 Native18：位置權限已允許，開始定位…"
                      );
                      beginLocation();
                  } else {
                      finalError("定位權限未允許");
                  }
              }

              @Override
              protected void onDestroy() {
                  stopLocationRequests();
                  scheduler.shutdownNow();

                  if (webView != null) {
                      webView.stopLoading();
                      webView.destroy();
                  }

                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

