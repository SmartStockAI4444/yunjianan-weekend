name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          CMDLINE_ROOT="$RUNNER_TEMP/android-cmdline-tools"

          echo "Installing private Android SDK into: $SDK_ROOT"

          rm -rf "$SDK_ROOT" "$CMDLINE_ROOT"
          mkdir -p "$SDK_ROOT/cmdline-tools/latest" "$CMDLINE_ROOT"

          curl -fL --retry 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -o "$RUNNER_TEMP/android-commandlinetools.zip"

          unzip -q "$RUNNER_TEMP/android-commandlinetools.zip" -d "$CMDLINE_ROOT"

          cp -R "$CMDLINE_ROOT/cmdline-tools/"* "$SDK_ROOT/cmdline-tools/latest/"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "sdkmanager: $SDKMANAGER"
          test -f "$SDKMANAGER"

          yes | bash "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true

          bash "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        shell: bash
        run: |
          set -e
          rm -rf _android_build
          mkdir -p _android_build/app/src/main/java/com/yunjianan/weekend
          mkdir -p _android_build/app/src/main/res/values
          mkdir -p _android_build/app/src/main/res/drawable
          mkdir -p _android_build/app/src/main/assets

          cp index.html _android_build/app/src/main/assets/index.html
          cp weekly_feed.json _android_build/app/src/main/assets/weekly_feed.json
          [ -f manifest.json ] && cp manifest.json _android_build/app/src/main/assets/manifest.json || true
          [ -f icon-192.png ] && cp icon-192.png _android_build/app/src/main/assets/icon-192.png || true
          [ -f icon-512.png ] && cp icon-512.png _android_build/app/src/main/assets/icon-512.png || true

          if [ -f icon-512.png ]; then
            cp icon-512.png _android_build/app/src/main/res/drawable/app_icon.png
          else
            cp icon-192.png _android_build/app/src/main/res/drawable/app_icon.png
          fi

          python3 - <<'PY'
          from pathlib import Path
          p=Path("_android_build/app/src/main/assets/index.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace("<head>", '<head>\n<script>window.__NATIVE_ANDROID_APP__=true;</script>', 1)
          s=s.replace(
              'function isStandaloneApp(){\n  return window.matchMedia("(display-mode: standalone)").matches ||\n    window.navigator.standalone===true;\n}',
              'function isStandaloneApp(){\n  return window.__NATIVE_ANDROID_APP__===true ||\n    window.matchMedia("(display-mode: standalone)").matches ||\n    window.navigator.standalone===true;\n}',
              1
          )
          s=s.replace(
              '  if("serviceWorker" in navigator){\n    window.addEventListener("load",function(){\n      navigator.serviceWorker.register("./service-worker.js").catch(function(){});\n    });\n  }',
              '  if(!window.__NATIVE_ANDROID_APP__ && "serviceWorker" in navigator){\n    window.addEventListener("load",function(){\n      navigator.serviceWorker.register("./service-worker.js").catch(function(){});\n    });\n  }',
              1
          )
          s=s.replace(
              "<script>\n(function(){",
              '<script>\nif(window.__NATIVE_ANDROID_APP__){\n  window.open=function(url){\n    if(url) window.location.href=url;\n    return null;\n  };\n}\n(function(){',
              1
          )
          native_hook = r"""
          if(window.__NATIVE_ANDROID_APP__){
            window.__receiveNativeLocation=function(lat,lng){
              currentUserCoord=[Number(lat),Number(lng)];
              locationState="ready";
              locationSource="gps";
              currentLocationLabel="手機目前位置";
              syncLocationPanel();
              refreshNearbyHint();
              render();
            };
          
            window.__nativeLocationError=function(msg){
              locationState="error";
              currentUserCoord=null;
              locationSource="";
              currentLocationLabel="";
              syncLocationPanel();
              setNearbyHint("⚠️ "+(msg||"目前無法取得手機位置")+"；可改用下方手動位置。","warn");
              render();
            };
          }
          """
          s=s.replace("</body>", "<script>"+native_hook+"</script>\\n</body>", 1)

          marker="function requestUserLocation(forceGps){"
          if marker in s:
              native_branch=r"""function requestUserLocation(forceGps){
            if(window.__NATIVE_ANDROID_APP__ && window.AndroidLocation){
              if(currentUserCoord&&!forceGps){
                locationState="ready";
                syncLocationPanel();
                refreshNearbyHint();
                render();
                return;
              }
          
              if(!forceGps && applySavedManualLocation()){
                return;
              }
          
              locationState="loading";
              locationSource="gps";
              currentLocationLabel="手機定位";
              syncLocationPanel();
              setNearbyHint("📍 正在由 Android 取得目前位置…","loading");
          
              try{
                window.AndroidLocation.requestLocation();
              }catch(e){
                window.__nativeLocationError("Android 定位服務啟動失敗");
              }
              return;
            }
          """
              s=s.replace(marker,native_branch,1)

          p.write_text(s,encoding="utf-8")
          PY

          cat > _android_build/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "YunJiaNanWeekend"
          include(":app")
          EOF

          cat > _android_build/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > _android_build/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          echo "sdk.dir=$ANDROID_SDK_ROOT" > _android_build/local.properties

          cat > _android_build/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.yunjianan.weekend'
              compileSdk 35

              defaultConfig {
                  applicationId "com.yunjianan.weekend"
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName "5.5-native-3"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

          echo '# no custom rules' > _android_build/app/proguard-rules.pro

          cat > _android_build/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1F6B4F</item>
                  <item name="android:statusBarColor">#1F6B4F</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowBackground">#F5F7F4</item>
              </style>
          </resources>
          EOF

          cat > _android_build/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-feature android:name="android.hardware.location" android:required="false" />
              <uses-feature android:name="android.hardware.location.gps" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/app_icon"
                  android:label="雲嘉南週末"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > _android_build/app/src/main/java/com/yunjianan/weekend/MainActivity.java <<'EOF'
          package com.yunjianan.weekend;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.ViewGroup;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import androidx.webkit.WebViewAssetLoader;

          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {

              private static final int LOCATION_PERMISSION_REQUEST = 4105;

              private WebView webView;
              private LocationManager locationManager;
              private LocationListener activeLocationListener;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private Location staleFallback;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  locationManager = (LocationManager) getSystemService(Context.LOCATION_SERVICE);

                  webView = new WebView(this);
                  webView.setLayoutParams(new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                  ));
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setGeolocationEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.addJavascriptInterface(new NativeLocationBridge(), "AndroidLocation");

                  WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(
                              WebView view,
                              WebResourceRequest request
                      ) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request
                      ) {
                          Uri uri = request.getUrl();

                          if ("appassets.androidplatform.net".equalsIgnoreCase(uri.getHost())) {
                              return false;
                          }

                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, uri));
                          } catch (Exception e) {
                              Toast.makeText(
                                      MainActivity.this,
                                      "無法開啟外部連結",
                                      Toast.LENGTH_SHORT
                              ).show();
                          }
                          return true;
                      }
                  });

                  if (savedInstanceState == null) {
                      webView.loadUrl("https://appassets.androidplatform.net/assets/index.html");
                  } else {
                      webView.restoreState(savedInstanceState);
                  }
              }

              public class NativeLocationBridge {
                  @JavascriptInterface
                  public void requestLocation() {
                      runOnUiThread(() -> requestNativeLocation());
                  }
              }

              private boolean hasLocationPermission() {
                  return checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)
                          == PackageManager.PERMISSION_GRANTED
                          || checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION)
                          == PackageManager.PERMISSION_GRANTED;
              }

              private void requestNativeLocation() {
                  if (!hasLocationPermission()) {
                      requestPermissions(
                              new String[] {
                                      Manifest.permission.ACCESS_FINE_LOCATION,
                                      Manifest.permission.ACCESS_COARSE_LOCATION
                              },
                              LOCATION_PERMISSION_REQUEST
                      );
                      return;
                  }

                  fetchLocationNow();
              }

              private void fetchLocationNow() {
                  if (!hasLocationPermission()) {
                      sendLocationError("尚未取得定位權限");
                      return;
                  }

                  if (locationManager == null) {
                      sendLocationError("Android 定位服務不可用");
                      return;
                  }

                  try {
                      List<String> providers = new ArrayList<>();

                      if (locationManager.isProviderEnabled(LocationManager.NETWORK_PROVIDER)) {
                          providers.add(LocationManager.NETWORK_PROVIDER);
                      }
                      if (locationManager.isProviderEnabled(LocationManager.GPS_PROVIDER)) {
                          providers.add(LocationManager.GPS_PROVIDER);
                      }

                      if (providers.isEmpty()) {
                          sendLocationError("請先開啟手機的「位置」服務");
                          return;
                      }

                      Location best = null;

                      for (String provider : providers) {
                          Location last = locationManager.getLastKnownLocation(provider);
                          if (last != null && (best == null || last.getTime() > best.getTime())) {
                              best = last;
                          }
                      }

                      staleFallback = best;

                      if (best != null) {
                          long ageMs = System.currentTimeMillis() - best.getTime();
                          if (ageMs <= 15 * 60 * 1000L) {
                              sendLocation(best);
                              return;
                          }
                      }

                      final String provider = providers.get(0);

                      activeLocationListener = new LocationListener() {
                          @Override
                          public void onLocationChanged(Location location) {
                              if (location != null) {
                                  stopLocationUpdates();
                                  sendLocation(location);
                              }
                          }

                          @Override
                          public void onProviderEnabled(String provider) {}

                          @Override
                          public void onProviderDisabled(String provider) {}

                          @Override
                          public void onStatusChanged(String provider, int status, Bundle extras) {}
                      };

                      locationManager.requestLocationUpdates(
                              provider,
                              0L,
                              0f,
                              activeLocationListener,
                              Looper.getMainLooper()
                      );

                      handler.postDelayed(() -> {
                          if (activeLocationListener != null) {
                              stopLocationUpdates();

                              if (staleFallback != null) {
                                  sendLocation(staleFallback);
                              } else {
                                  sendLocationError("定位逾時，請稍後再試一次");
                              }
                          }
                      }, 12000);

                  } catch (SecurityException e) {
                      sendLocationError("Android 未允許定位權限");
                  } catch (Exception e) {
                      sendLocationError("無法取得目前位置");
                  }
              }

              private void stopLocationUpdates() {
                  if (locationManager != null && activeLocationListener != null) {
                      try {
                          locationManager.removeUpdates(activeLocationListener);
                      } catch (Exception ignored) {}
                  }

                  activeLocationListener = null;
              }

              private void sendLocation(Location location) {
                  final double lat = location.getLatitude();
                  final double lng = location.getLongitude();

                  runOnUiThread(() -> webView.evaluateJavascript(
                          "window.__receiveNativeLocation(" + lat + "," + lng + ");",
                          null
                  ));
              }

              private void sendLocationError(String message) {
                  final String safe = org.json.JSONObject.quote(
                          message == null ? "" : message
                  );

                  runOnUiThread(() -> webView.evaluateJavascript(
                          "window.__nativeLocationError(" + safe + ");",
                          null
                  ));
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] grantResults
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);

                  if (requestCode != LOCATION_PERMISSION_REQUEST) {
                      return;
                  }

                  if (hasLocationPermission()) {
                      fetchLocationNow();
                  } else {
                      sendLocationError("定位權限未允許");
                  }
              }

              @Override
              protected void onDestroy() {
                  stopLocationUpdates();

                  if (webView != null) {
                      webView.stopLoading();
                      webView.destroy();
                  }

                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Verify Android environment
        shell: bash
        run: |
          set -e
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -f "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"
          test -f "_android_build/local.properties"
          cat "_android_build/local.properties"

      - name: Build APK
        run: gradle -p _android_build assembleDebug --stacktrace

      - name: Rename APK
        run: cp _android_build/app/build/outputs/apk/debug/app-debug.apk YunJiaNanWeekend-V5.5-native3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YunJiaNanWeekend-V5.5-Native3-APK
          path: YunJiaNanWeekend-V5.5-native3.apk
          if-no-files-found: error
