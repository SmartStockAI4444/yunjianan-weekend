          old_compact_planner='function buildCompactSmartPlan(candidates,opts,startCoord,maxStops){\n  var pool=(candidates||[]).slice(0,100);\n  var chosen=[];\n  var current=startCoord||null;\n  var activityCount=0;\n  var activityLimit=opts.timeMode==="full"?2:1;\n  var roleCounts={};\n  var targetDay=planDayMode(opts.dayMode);\n\n  function alreadyChosen(s){\n    return chosen.indexOf(s)>=0;\n  }\n\n  function pickOne(maxLeg,allowExtraActivity){\n    var best=null,bestScore=-1e9;\n\n    pool.forEach(function(s){\n      if(!s||alreadyChosen(s))return;\n      if(s.type==="活動" && !planEventActiveForDay(s,targetDay))return;\n      if(s.type==="活動" && activityCount>=activityLimit && !allowExtraActivity)return;\n\n      var coord=stopCoord(s);\n      var leg=0;\n\n      if(opts.city==="附近" && startCoord && !coord)return;\n\n      if(current&&coord){\n        leg=geoDistance(current,coord);\n        if(isFinite(leg)&&leg>maxLeg)return;\n      }\n\n      var score=smartPlanScore(s,opts.theme,startCoord,opts.timeMode);\n\n      var arrivalMinute=planCandidateArrivalMinute(chosen,s,opts,startCoord);\n      var knownStatus=arrivalMinute==null?null:planKnownHoursStatus(s,arrivalMinute,targetDay);\n      if(knownStatus==="closed")score-=90;\n      else if(knownStatus==="open")score+=8;\n\n      if(current&&coord&&isFinite(leg)){\n        score-=leg*1.8;\n      }\n\n      if(chosen.length){\n        var prev=chosen[chosen.length-1];\n        if(prev.city===s.city)score+=7;\n        if(prev.type===s.type)score-=4;\n      }\n\n      var role=planStopRole(s);\n      var used=roleCounts[role]||0;\n\n      if(opts.theme!=="美食"){\n        score-=used*12;\n      }\n\n      if(opts.timeMode==="full" && role==="美食"){\n        var lunch=planMealWindow("lunch");\n        var dinner=planMealWindow("dinner");\n\n        if(arrivalMinute>=lunch.foodStart && arrivalMinute<=lunch.foodEnd){\n          score+=70;\n        }else if(arrivalMinute>=dinner.foodStart && arrivalMinute<=dinner.foodEnd){\n          score+=45;\n        }else if(chosen.length===1){\n          score+=24;\n        }else if(chosen.length===2){\n          score+=8;\n        }\n      }\n\n      if(s.type==="活動" && planEventActiveForDay(s,targetDay))score+=6;\n\n      if(score>bestScore){\n        bestScore=score;\n        best=s;\n      }\n    });\n\n    if(!best)return false;\n\n    chosen.push(best);\n    if(best.type==="活動")activityCount++;\n\n    var bestRole=planStopRole(best);\n    roleCounts[bestRole]=(roleCounts[bestRole]||0)+1;\n\n    var next=stopCoord(best);\n    if(next)current=next;\n\n    return true;\n  }\n\n  while(chosen.length<maxStops){\n    if(pickOne(planLegLimit(opts.timeMode,false),false))continue;\n    if(pickOne(planLegLimit(opts.timeMode,true),false))continue;\n    if(pickOne(planLegLimit(opts.timeMode,true),true))continue;\n    break;\n  }\n\n  return chosen;\n}\n\n\n'
          new_compact_planner='function buildCompactSmartPlan(candidates,opts,startCoord,maxStops){\n  var allCandidates=(candidates||[]);\n  var pool=allCandidates.slice(0,120);\n\n  /* Keep proper-meal candidates visible even if their heat score is lower. */\n  if(opts.timeMode==="full"){\n    allCandidates.forEach(function(s){\n      if(pool.length>=160)return;\n      if(planIsMealStop(s) && pool.indexOf(s)<0){\n        pool.push(s);\n      }\n    });\n  }\n\n  var chosen=[];\n  var current=startCoord||null;\n  var activityCount=0;\n  var activityLimit=opts.timeMode==="full"?2:1;\n  var roleCounts={};\n  var targetDay=planDayMode(opts.dayMode);\n\n  function alreadyChosen(s){\n    return chosen.indexOf(s)>=0;\n  }\n\n  function pickOne(maxLeg,allowExtraActivity){\n    var best=null,bestScore=-1e9;\n\n    pool.forEach(function(s){\n      if(!s||alreadyChosen(s))return;\n      if(s.type==="活動" && !planEventActiveForDay(s,targetDay))return;\n      if(s.type==="活動" && activityCount>=activityLimit && !allowExtraActivity)return;\n\n      var coord=stopCoord(s);\n      var leg=0;\n\n      if(opts.city==="附近" && startCoord && !coord)return;\n\n      if(current&&coord){\n        leg=geoDistance(current,coord);\n        if(isFinite(leg)&&leg>maxLeg)return;\n      }\n\n      var score=smartPlanScore(s,opts.theme,startCoord,opts.timeMode);\n\n      var arrivalMinute=planCandidateArrivalMinute(chosen,s,opts,startCoord);\n      var knownStatus=arrivalMinute==null?null:planKnownHoursStatus(s,arrivalMinute,targetDay);\n      if(knownStatus==="closed")score-=90;\n      else if(knownStatus==="open")score+=8;\n\n      if(current&&coord&&isFinite(leg)){\n        score-=leg*1.8;\n      }\n\n      if(chosen.length){\n        var prev=chosen[chosen.length-1];\n        if(prev.city===s.city)score+=7;\n        if(prev.type===s.type)score-=4;\n      }\n\n      var role=planStopRole(s);\n      var used=roleCounts[role]||0;\n\n      if(opts.theme!=="美食"){\n        score-=used*12;\n      }\n\n      if(opts.timeMode==="full" && role==="美食"){\n        var lunch=planMealWindow("lunch");\n        var dinner=planMealWindow("dinner");\n        var foodClass=planMealFoodClass(s);\n        var inLunch=arrivalMinute>=lunch.foodStart && arrivalMinute<=lunch.foodEnd;\n        var inDinner=arrivalMinute>=dinner.foodStart && arrivalMinute<=dinner.foodEnd;\n\n        if(inLunch){\n          if(foodClass==="meal"){\n            score+=110;\n          }else if(foodClass==="snack"){\n            score-=55;\n          }else{\n            score-=30;\n          }\n        }else if(inDinner){\n          if(foodClass==="meal"){\n            score+=75;\n          }else if(foodClass==="snack"){\n            score-=35;\n          }else{\n            score-=20;\n          }\n        }else if(foodClass==="meal" && chosen.length===1){\n          score+=18;\n        }else if(foodClass==="snack"){\n          score-=5;\n        }\n      }\n\n      if(s.type==="活動" && planEventActiveForDay(s,targetDay))score+=6;\n\n      if(score>bestScore){\n        bestScore=score;\n        best=s;\n      }\n    });\n\n    if(!best)return false;\n\n    chosen.push(best);\n    if(best.type==="活動")activityCount++;\n\n    var bestRole=planStopRole(best);\n    roleCounts[bestRole]=(roleCounts[bestRole]||0)+1;\n\n    var next=stopCoord(best);\n    if(next)current=next;\n\n    return true;\n  }\n\n  while(chosen.length<maxStops){\n    if(pickOne(planLegLimit(opts.timeMode,false),false))continue;\n    if(pickOne(planLegLimit(opts.timeMode,true),false))continue;\n    if(pickOne(planLegLimit(opts.timeMode,true),true))continue;\n    break;\n  }\n\n  return chosen;\n}\n\n\n'
