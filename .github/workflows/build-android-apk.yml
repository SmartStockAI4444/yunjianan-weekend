name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          CMDLINE_ROOT="$RUNNER_TEMP/android-cmdline-tools"

          echo "Installing private Android SDK into: $SDK_ROOT"

          rm -rf "$SDK_ROOT" "$CMDLINE_ROOT"
          mkdir -p "$SDK_ROOT/cmdline-tools/latest" "$CMDLINE_ROOT"

          curl -fL --retry 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -o "$RUNNER_TEMP/android-commandlinetools.zip"

          unzip -q "$RUNNER_TEMP/android-commandlinetools.zip" -d "$CMDLINE_ROOT"

          cp -R "$CMDLINE_ROOT/cmdline-tools/"* "$SDK_ROOT/cmdline-tools/latest/"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "sdkmanager: $SDKMANAGER"
          test -f "$SDKMANAGER"

          yes | bash "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true

          bash "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        shell: bash
        run: |
          set -e
          rm -rf _android_build
          mkdir -p _android_build/app/src/main/java/com/yunjianan/weekend
          mkdir -p _android_build/app/src/main/res/values
          mkdir -p _android_build/app/src/main/res/drawable
          mkdir -p _android_build/app/src/main/assets

          cp index.html _android_build/app/src/main/assets/index.html
          cp weekly_feed.json _android_build/app/src/main/assets/weekly_feed.json
          [ -f manifest.json ] && cp manifest.json _android_build/app/src/main/assets/manifest.json || true
          [ -f icon-192.png ] && cp icon-192.png _android_build/app/src/main/assets/icon-192.png || true
          [ -f icon-512.png ] && cp icon-512.png _android_build/app/src/main/assets/icon-512.png || true

          if [ -f icon-512.png ]; then
            cp icon-512.png _android_build/app/src/main/res/drawable/app_icon.png
          else
            cp icon-192.png _android_build/app/src/main/res/drawable/app_icon.png
          fi

          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          p=Path("_android_build/app/src/main/assets/index.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace("<head>", '<head>\n<script>window.__NATIVE_ANDROID_APP__=true;</script>', 1)
          s=s.replace(
              'function isStandaloneApp(){\n  return window.matchMedia("(display-mode: standalone)").matches ||\n    window.navigator.standalone===true;\n}',
              'function isStandaloneApp(){\n  return window.__NATIVE_ANDROID_APP__===true ||\n    window.matchMedia("(display-mode: standalone)").matches ||\n    window.navigator.standalone===true;\n}',
              1
          )
          s=s.replace(
              '  if("serviceWorker" in navigator){\n    window.addEventListener("load",function(){\n      navigator.serviceWorker.register("./service-worker.js").catch(function(){});\n    });\n  }',
              '  if(!window.__NATIVE_ANDROID_APP__ && "serviceWorker" in navigator){\n    window.addEventListener("load",function(){\n      navigator.serviceWorker.register("./service-worker.js").catch(function(){});\n    });\n  }',
              1
          )
          s=s.replace(
              "<script>\n(function(){",
              '<script>\nif(window.__NATIVE_ANDROID_APP__){\n  window.open=function(url){\n    if(url) window.location.href=url;\n    return null;\n  };\n}\n(function(){',
              1
          )
          native_hook = r"""
          if(window.__NATIVE_ANDROID_APP__){
            window.__nativeLocationTimer=null;

            window.__clearNativeLocationTimer=function(){
              if(window.__nativeLocationTimer){
                clearTimeout(window.__nativeLocationTimer);
                window.__nativeLocationTimer=null;
              }
            };

            window.__receiveNativeLocation=function(lat,lng){
              window.__clearNativeLocationTimer();
              currentUserCoord=[Number(lat),Number(lng)];
              locationState="ready";
              locationSource="gps";
              currentLocationLabel="手機目前位置";
              syncLocationPanel();
              if(typeof setLocationPanelExpanded==="function")setLocationPanelExpanded(false);
              refreshNearbyHint();
              render();
              if(window.__pendingSmartPlan && typeof runSmartPlan==="function"){
                var pendingPlan=window.__pendingSmartPlan;
                window.__pendingSmartPlan=null;
                setTimeout(function(){runSmartPlan(pendingPlan);},80);
              }
            };

            window.__nativeLocationError=function(msg){
              window.__clearNativeLocationTimer();
              locationState="error";
              currentUserCoord=null;
              locationSource="";
              currentLocationLabel="";
              syncLocationPanel();
              if(typeof setLocationPanelExpanded==="function")setLocationPanelExpanded(true);
              setNearbyHint("⚠️ "+(msg||"目前無法取得手機位置")+"；可展開位置設定改用手動位置。","warn");
              render();
              if(window.__pendingSmartPlan){
                window.__pendingSmartPlan=null;
                if($("pr")){
                  $("pr").innerHTML='<div class="plan-title">📍 無法取得目前位置</div>'+
                    '<div class="plan-route-note">請到「離我近」展開位置設定，改用手動位置後再產生 AI 行程。</div>';
                }
              }
            };
          }
          """
          marker="function requestUserLocation(forceGps){"
          if marker in s:
              # IMPORTANT: inject native callbacks inside the same IIFE,
              # before requestUserLocation(), so they close over app state vars.
              s=s.replace(marker, native_hook+"\n"+marker, 1)
              native_branch=r"""function requestUserLocation(forceGps){
            if(window.__NATIVE_ANDROID_APP__ && window.AndroidLocation){
              if(currentUserCoord&&!forceGps){
                locationState="ready";
                syncLocationPanel();
                refreshNearbyHint();
                render();
                return;
              }
          
              if(!forceGps && applySavedManualLocation()){
                return;
              }
          
              locationState="loading";
              locationSource="gps";
              currentLocationLabel="手機定位";
              syncLocationPanel();
              setNearbyHint("📍 Native20：正在呼叫 Android 定位…","loading");
          
              try{
                window.__clearNativeLocationTimer();
                window.__nativeLocationTimer=setTimeout(function(){
                  window.__nativeLocationError(
                    "Android 定位超過 20 秒沒有回應"
                  );
                },20000);

                window.AndroidLocation.requestLocation();
              }catch(e){
                window.__nativeLocationError("Android 定位服務啟動失敗");
              }
              return;
            }
          """
              s=s.replace(marker,native_branch,1)

          # Native18: fix nearbyMatchCount() calling a non-existent matchFilter().
          if 'if(!matchFilter(s))return false;' in s:
              s=s.replace(
                  'if(!matchFilter(s))return false;',
                  'if(!okTags(s))return false;\n'
                  '    if(sel["活動"]&&!isTravelFriendlyEvent(s))return false;\n'
                  '    if(favOnly&&!favs[s.id])return false;',
                  1
              )

          # Native18: nearby mode should show the full distance-sorted list.
          old_featured=(
              '  var box=$("featuredCards");\n'
              '  var section=$("weekendFeatured");\n'
              '  var count=$("featuredCount");\n'
              '  if(!box||!section)return;\n\n'
              '  var picks=featuredCandidates();'
          )
          new_featured=(
              '  var box=$("featuredCards");\n'
              '  var section=$("weekendFeatured");\n'
              '  var count=$("featuredCount");\n'
              '  if(!box||!section)return;\n\n'
              '  if(sort==="附近"){\n'
              '    section.style.display="none";\n'
              '    box.innerHTML="";\n'
              '    currentFeaturedIds={};\n'
              '    if(count)count.textContent="";\n'
              '    return;\n'
              '  }\n'
              '  section.style.display="";\n\n'
              '  var picks=featuredCandidates();'
          )
          if old_featured not in s:
              raise RuntimeError("Native18 cannot find renderFeatured anchor")
          s=s.replace(old_featured,new_featured,1)

          # Native18: collapse the large manual-location controls by default.
          old_panel=textwrap.dedent("""\
          <div id="locationPanel" class="location-panel hidden">
            <div class="location-panel-head">
              <span>📍 位置來源</span>
              <span id="locationSourceBadge" class="location-source-badge">尚未設定</span>
            </div>
            <button id="useGpsLocation" class="gps-location-btn">📡 使用手機定位</button>
            <div class="manual-location-title">或手動選擇目前位置</div>
            <div class="manual-location-grid">
              <select id="manualCity" aria-label="縣市">
                <option value="嘉義">嘉義</option>
                <option value="雲林">雲林</option>
                <option value="台南">台南</option>
              </select>
              <select id="manualTown" aria-label="鄉鎮市區"></select>
              <button id="applyManualLocation">套用位置</button>
            </div>
            <div class="manual-location-note">手動位置只用來估算「離我近」；Google Maps 導航仍使用手機實際定位。</div>
          </div>""")
          new_panel=textwrap.dedent("""\
          <div id="locationPanel" class="location-panel hidden collapsed">
            <div class="location-panel-head">
              <span>📍 位置來源</span>
              <div class="location-head-right">
                <span id="locationSourceBadge" class="location-source-badge">尚未設定</span>
                <button id="locationPanelToggle" class="location-panel-toggle" type="button" aria-expanded="false">設定 ▼</button>
              </div>
            </div>
            <div id="locationPanelBody" class="location-panel-body hidden">
              <button id="useGpsLocation" class="gps-location-btn">📡 重新使用手機定位</button>
              <div class="manual-location-title">或手動選擇目前位置</div>
              <div class="manual-location-grid">
                <select id="manualCity" aria-label="縣市">
                  <option value="嘉義">嘉義</option>
                  <option value="雲林">雲林</option>
                  <option value="台南">台南</option>
                </select>
                <select id="manualTown" aria-label="鄉鎮市區"></select>
                <button id="applyManualLocation">套用位置</button>
              </div>
              <div class="manual-location-note">手動位置只用來估算「離我近」；Google Maps 導航仍使用手機實際定位。</div>
            </div>
          </div>""")
          if old_panel not in s:
              raise RuntimeError("Native18 cannot find location panel HTML")
          s=s.replace(old_panel,new_panel,1)

          css_anchor=".location-panel.hidden{display:none}"
          css_new=textwrap.dedent("""\
          .location-panel.hidden{display:none}
          .location-panel.collapsed{
            padding-top:10px;
            padding-bottom:10px;
          }
          .location-head-right{
            display:flex;
            align-items:center;
            justify-content:flex-end;
            gap:7px;
            min-width:0;
          }
          .location-panel-toggle{
            flex:0 0 auto;
            height:28px;
            padding:0 10px;
            border:0;
            border-radius:999px;
            background:#e6f2eb;
            color:#1c6b4b;
            font-size:10px;
            font-weight:950;
          }
          .location-panel-body.hidden{display:none}""")
          if css_anchor not in s:
              raise RuntimeError("Native18 cannot find location CSS anchor")
          s=s.replace(css_anchor,css_new,1)

          sync_anchor=textwrap.dedent("""\
          function syncLocationPanel(){
            var panel=$("locationPanel");""")
          sync_new=textwrap.dedent("""\
          function setLocationPanelExpanded(open){
            var panel=$("locationPanel");
            var body=$("locationPanelBody");
            var btn=$("locationPanelToggle");
            if(!panel||!body||!btn)return;

            body.classList.toggle("hidden",!open);
            panel.classList.toggle("collapsed",!open);
            btn.textContent=open?"收合 ▲":"設定 ▼";
            btn.setAttribute("aria-expanded",open?"true":"false");
          }

          function syncLocationPanel(){
            var panel=$("locationPanel");""")
          if sync_anchor not in s:
              raise RuntimeError("Native18 cannot find syncLocationPanel")
          s=s.replace(sync_anchor,sync_new,1)

          init_anchor=(
              '  syncNearbyRange();\n'
              '  syncLocationPanel();\n\n'
              '  $("search").oninput=function(){query=this.value;render()};'
          )
          init_new=(
              '  syncNearbyRange();\n'
              '  syncLocationPanel();\n'
              '  setLocationPanelExpanded(false);\n\n'
              '  if($("locationPanelToggle")){\n'
              '    $("locationPanelToggle").onclick=function(){\n'
              '      var body=$("locationPanelBody");\n'
              '      setLocationPanelExpanded(!!(body&&body.classList.contains("hidden")));\n'
              '    };\n'
              '  }\n\n'
              '  $("search").oninput=function(){query=this.value;render()};'
          )
          if init_anchor not in s:
              raise RuntimeError("Native18 cannot find init location anchor")
          s=s.replace(init_anchor,init_new,1)

          # Build-time guards for Native18 UI.
          for token in [
              'id="locationPanelToggle"',
              'function setLocationPanelExpanded(open)',
              'section.style.display="none"',
              'class="distance-chip"',
              'a=nearbySort(a)'
          ]:
              if token not in s:
                  raise RuntimeError("Native18 missing expected token: "+token)


          # Native18: stronger nearby distance presentation and distance bands.
          native14_css = r"""
          /* ===== Native18 Nearby Distance UI ===== */
          .distance-chip{
            min-height:28px;
            padding:0 9px;
            box-shadow:0 3px 10px rgba(24,70,50,.10);
            border:1px solid rgba(24,70,50,.08);
          }
          .distance-chip.nearest{
            background:#17372a;
            color:#fff;
            border-color:#17372a;
          }
          .distance-chip.near{
            background:#dff3e8;
            color:#176747;
            border-color:#c8e8d7;
          }
          .distance-chip.far{
            background:#fff1d9;
            color:#8b5b18;
            border-color:#f0dfbe;
          }
          .nearby-zone{
            grid-column:1 / -1;
            width:100%;
            display:flex;
            align-items:flex-end;
            justify-content:space-between;
            gap:10px;
            margin:2px 2px -2px;
            padding:7px 2px 3px;
            color:#203b31;
          }
          .nearby-zone span{
            font-size:15px;
            font-weight:950;
            letter-spacing:.02em;
          }
          .nearby-zone small{
            font-size:10px;
            font-weight:850;
            color:#7a8982;
          }
          .nearby-zone.nearest span:before{content:"📍 "; }
          .nearby-zone.near span:before{content:"🚗 "; }
          .nearby-zone.far span:before{content:"🧭 "; }
          .nearby-range button{
            transition:transform .16s ease,background .16s ease,color .16s ease,box-shadow .16s ease;
          }
          .nearby-range button:active{transform:scale(.95)}
          .nearby-hint.nearby-pulse{
            animation:nearbyHintPulse .35s ease;
          }
          .cards.nearby-updated .travel-card{
            animation:nearbyCardIn .28s ease both;
          }
          @keyframes nearbyHintPulse{
            0%{transform:scale(.985);opacity:.75}
            100%{transform:scale(1);opacity:1}
          }
          @keyframes nearbyCardIn{
            0%{transform:translateY(5px);opacity:.82}
            100%{transform:translateY(0);opacity:1}
          }
          """
          if "</style>" not in s:
              raise RuntimeError("Native18 cannot find style end")
          s=s.replace("</style>",native14_css+"\n</style>",1)

          native14_helpers = r"""
          function nearbyBand(d){
            if(d==null||!isFinite(d))return "";
            if(d<=3)return "nearest";
            if(d<=10)return "near";
            return "far";
          }

          function nearbyBandMeta(b){
            if(b==="nearest")return {title:"最近",range:"3 km 內"};
            if(b==="near")return {title:"稍近",range:"3–10 km"};
            if(b==="far")return {title:"較遠",range:"10 km 以上"};
            return {title:"附近",range:""};
          }

          function distanceChipHtml(s){
            if(sort!=="附近")return "";
            var d=itemDistanceKm(s);
            if(d==null)return "";
            var band=nearbyBand(d);
            return '<span class="distance-chip '+band+'">📍 '+formatDistanceKm(d)+'</span>';
          }

          function pulseNearbyRefresh(){
            var hint=$("nearbyHint");
            var cards=$("cards");

            if(hint){
              hint.classList.remove("nearby-pulse");
              void hint.offsetWidth;
              hint.classList.add("nearby-pulse");
            }

            if(cards){
              cards.classList.remove("nearby-updated");
              void cards.offsetWidth;
              cards.classList.add("nearby-updated");
            }

            setTimeout(function(){
              if(hint)hint.classList.remove("nearby-pulse");
              if(cards)cards.classList.remove("nearby-updated");
            },420);
          }
          """
          sort_marker="function nearbySort(items){"
          if sort_marker not in s:
              raise RuntimeError("Native18 cannot find nearbySort marker")
          s=s.replace(sort_marker,native14_helpers+"\n"+sort_marker,1)

          old_distance_chip = """          (sort==="附近"&&itemDistanceKm(s)!=null?'<span class="distance-chip">📍 '+formatDistanceKm(itemDistanceKm(s))+'</span>':'')+"""
          new_distance_chip = """          distanceChipHtml(s)+"""
          if old_distance_chip not in s:
              raise RuntimeError("Native18 cannot find distance chip render line")
          s=s.replace(old_distance_chip,new_distance_chip,1)

          old_card_loop = """  a.forEach(function(s){"""
          new_card_loop = r"""  var lastNearbyBand="";
            a.forEach(function(s){
              if(sort==="附近"&&currentUserCoord){
                var dBand=itemDistanceKm(s);
                var band=nearbyBand(dBand);

                if(band&&band!==lastNearbyBand){
                  var meta=nearbyBandMeta(band);
                  var zone=document.createElement("div");
                  zone.className="nearby-zone "+band;
                  zone.innerHTML='<span>'+meta.title+'</span><small>'+meta.range+'</small>';
                  box.appendChild(zone);
                  lastNearbyBand=band;
                }
              }"""
          if old_card_loop not in s:
              raise RuntimeError("Native18 cannot find card loop")
          s=s.replace(old_card_loop,new_card_loop,1)

          old_radius_click = r"""      nearbyRadius=raw==="all"?"all":Number(raw);
                syncNearbyRange();
                render();"""
          new_radius_click = r"""      nearbyRadius=raw==="all"?"all":Number(raw);
                syncNearbyRange();
                render();
                pulseNearbyRefresh();"""
          if old_radius_click not in s:
              raise RuntimeError("Native18 cannot find nearby radius click handler")
          s=s.replace(old_radius_click,new_radius_click,1)

          s=s.replace(
              '<div id="nearbyHint" class="nearby-hint hidden"></div>',
              '<div id="nearbyHint" class="nearby-hint hidden" aria-live="polite"></div>',
              1
          )

          # Native18 build guards.
          for token in [
              'function nearbyBand(d)',
              'function distanceChipHtml(s)',
              'zone.className="nearby-zone "+band',
              'pulseNearbyRefresh();',
              'aria-live="polite"',
              '.distance-chip.nearest'
          ]:
              if token not in s:
                  raise RuntimeError("Native18 missing expected token: "+token)



          # Native18: clean up duplicate nearby cards and make estimated distance less falsely precise.
          native15_helpers = r"""
          function hasPreciseDistanceCoord(s){
            if(!s)return false;

            var lat=Number(s.lat!=null?s.lat:s.latitude);
            var lng=Number(s.lng!=null?s.lng:(s.lon!=null?s.lon:s.longitude));
            if(isFinite(lat)&&isFinite(lng)&&Math.abs(lat)<=90&&Math.abs(lng)<=180){
              return true;
            }

            return !!PRECISE_COORDS[String(s.id||"")];
          }

          function formatDistanceForItem(s){
            var d=itemDistanceKm(s);
            if(d==null||!isFinite(d))return "";

            if(hasPreciseDistanceCoord(s)){
              return formatDistanceKm(d);
            }

            return "約 "+Math.max(1,Math.round(d))+" km";
          }

          function nearbyDisplayDedupe(items){
            var seen={},out=[];

            (items||[]).forEach(function(s){
              var nameKey=dedupeName((s&&s.name)||"");
              var key=String((s&&s.city)||"")+"|"+nameKey;

              if(!nameKey){
                out.push(s);
                return;
              }

              if(seen[key]==null){
                seen[key]=out.length;
                out.push(s);
              }else{
                var idx=seen[key];
                out[idx]=mergeDuplicate(out[idx],s);
              }
            });

            return out;
          }
          """

          nearby_sort_marker="function nearbySort(items){"
          if nearby_sort_marker not in s:
              raise RuntimeError("Native18 cannot find nearbySort marker")
          s=s.replace(nearby_sort_marker,native15_helpers+"\n"+nearby_sort_marker,1)

          old_nearby_list=(
              '  if(sort==="附近"){\n'
              '    if(currentUserCoord){\n'
              '      a=a.filter(withinNearbyRadius);\n'
              '      a=nearbySort(a);\n'
              '    }else{\n'
              '      a=diversifyRecommendations(a);\n'
              '    }\n'
              '  }'
          )
          new_nearby_list=(
              '  if(sort==="附近"){\n'
              '    a=nearbyDisplayDedupe(a);\n\n'
              '    if(currentUserCoord){\n'
              '      a=a.filter(withinNearbyRadius);\n'
              '      a=nearbySort(a);\n'
              '    }else{\n'
              '      a=diversifyRecommendations(a);\n'
              '    }\n'
              '  }'
          )
          if old_nearby_list not in s:
              raise RuntimeError("Native18 cannot find nearby list block")
          s=s.replace(old_nearby_list,new_nearby_list,1)

          old_distance_html = r"""return '<span class="distance-chip '+band+'">📍 '+formatDistanceKm(d)+'</span>';"""
          new_distance_html = r"""return '<span class="distance-chip '+band+'">📍 '+formatDistanceForItem(s)+'</span>';"""
          if old_distance_html not in s:
              raise RuntimeError("Native18 cannot find distanceChipHtml formatter")
          s=s.replace(old_distance_html,new_distance_html,1)

          old_count = "var count=nearbyMatchCount(data);"
          new_count = "var count=list().length;"
          if old_count not in s:
              raise RuntimeError("Native18 cannot find nearby count line")
          s=s.replace(old_count,new_count,1)

          # Native18 guards.
          for token in [
              'function nearbyDisplayDedupe(items)',
              'function formatDistanceForItem(s)',
              'a=nearbyDisplayDedupe(a);',
              "var count=list().length;",
              "formatDistanceForItem(s)"
          ]:
              if token not in s:
                  raise RuntimeError("Native18 missing expected token: "+token)



          # Native18: AI smart itinerary planner (3–5 stops, current location, theme, route).
          ai18_css = r"""
          .plan-start-hint{
            margin-top:10px;padding:9px 11px;border-radius:12px;
            background:rgba(255,255,255,.08);color:#d8e7df;
            font-size:12px;font-weight:750;line-height:1.45
          }
          .plan-smart-summary{
